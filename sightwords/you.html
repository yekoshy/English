<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learn the word "you"</title>
    <style>
        /* Light, Colorful Theme & Big Kid-Friendly Fonts */
        :root {
            --bg-color: #F8F9FA;
            --primary: #FF595E;
            --secondary: #FFCA3A;
            --tertiary: #8AC926;
            --quaternary: #1982C4;
            --text-color: #333333;
            --white: #FFFFFF;
        }

        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Fredoka One', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 10px;
            text-align: center;
            overflow-x: hidden;
        }

        /* Sound Toggle Button */
        .sound-toggle {
            position: fixed;
            top: 15px;
            right: 15px;
            background-color: var(--tertiary);
            color: white;
            border: 4px solid #6BAA1C;
            border-radius: 20px;
            padding: 10px 20px;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 0 #6BAA1C;
            transition: all 0.2s;
            z-index: 1000;
            font-family: inherit;
        }

        .sound-toggle:active {
            transform: translateY(5px);
            box-shadow: none;
        }

        .sound-toggle.off {
            background-color: var(--primary);
            border-color: #C13D41;
            box-shadow: 0 5px 0 #C13D41;
        }

        /* Clickable text for reading aloud */
        .readable-text {
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
            border-radius: 15px;
            display: inline-block;
            padding: 5px 15px;
        }

        .readable-text:hover {
            background-color: rgba(255, 202, 58, 0.35);
            transform: scale(1.03);
        }

        .readable-text:active {
            transform: scale(0.97);
        }

        h1 {
            color: var(--primary);
            font-size: 3.5rem;
            margin-top: 65px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 0px #DDD;
        }

        /* Tabs Navigation */
        .tabs {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 20px;
        }

        .tab-btn {
            background-color: var(--white);
            border: 4px solid var(--quaternary);
            border-radius: 20px;
            padding: 15px 25px;
            font-size: 1.8rem;
            font-family: inherit;
            font-weight: bold;
            color: var(--quaternary);
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 5px 0 var(--quaternary);
        }

        .tab-btn:hover, .tab-btn.active {
            background-color: var(--quaternary);
            color: var(--white);
            transform: translateY(3px);
            box-shadow: 0 2px 0 var(--quaternary);
        }

        .tab-content {
            display: none;
            background-color: var(--white);
            border-radius: 30px;
            padding: 30px;
            max-width: 900px;
            margin: 0 auto;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Shared Button Styles */
        button {
            font-family: inherit;
            cursor: pointer;
        }

        .big-btn {
            background-color: var(--tertiary);
            color: white;
            border: none;
            border-radius: 15px;
            padding: 15px 35px;
            font-size: 2rem;
            font-weight: bold;
            margin: 10px;
            box-shadow: 0 6px 0 #6BAA1C;
            transition: transform 0.1s;
        }

        .big-btn:active {
            transform: translateY(6px);
            box-shadow: none;
        }

        /* Reading Syllables & Word Rhythm Coloring */
        .syl-a { color: var(--primary); }    /* Red */
        .syl-b { color: var(--quaternary); } /* Blue */

        /* --- Tab 1: Read (Slideshow) --- */
        .slide {
            display: none;
            padding: 20px;
        }
        .slide.active {
            display: block;
            animation: slideIn 0.4s ease-out;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .slide-emoji {
            font-size: 6.5rem;
            margin: 10px 0;
            line-height: 1.2;
        }
        .slide-text {
            font-size: 3.5rem;
            margin: 20px 0;
            font-weight: bold;
        }
        .slide-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;
            margin-top: 30px;
        }
        .dots {
            display: flex;
            gap: 12px;
        }
        .dot {
            width: 24px;
            height: 24px;
            background-color: #E0E0E0;
            border-radius: 50%;
            transition: background-color 0.3s, transform 0.3s;
        }
        .dot.active {
            background-color: var(--primary);
            transform: scale(1.2);
        }

        /* --- Tab 2: Find (Search Game) --- */
        #timer {
            font-size: 2.4rem;
            color: var(--primary);
            font-weight: bold;
            background: #FFE8E8;
            border-radius: 15px;
            display: inline-block;
            padding: 10px 25px;
            margin-bottom: 15px;
        }
        .word-grid {
            display: grid;
            gap: 15px;
            margin: 20px auto;
            max-width: 720px;
        }
        .search-word {
            background-color: var(--secondary);
            border: 4px solid #E5B532;
            border-radius: 20px;
            font-size: 2.4rem;
            padding: 18px 10px;
            font-weight: bold;
            color: var(--text-color);
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
        }
        .search-word:hover {
            transform: scale(1.05);
        }
        .search-word.found {
            background-color: var(--tertiary);
            color: white;
            border-color: #6BAA1C;
            transform: scale(0.95);
            pointer-events: none;
        }
        .search-word.wrong {
            background-color: var(--primary);
            color: white;
            border-color: #C13D41;
            animation: shake 0.3s;
        }
        .hint {
            background-color: #8AC926 !important;
            color: white !important;
            border: 5px solid #1982C4 !important;
            animation: pulseHint 0.8s infinite;
            z-index: 10;
        }
        @keyframes pulseHint {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); box-shadow: 0 0 15px var(--quaternary); }
            100% { transform: scale(1); }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-15px); }
            75% { transform: translateX(15px); }
        }

        /* --- Tab 3: Write (Train Game) --- */
        .train-container {
            background: #E8F4FA;
            padding: 30px;
            border-radius: 20px;
            border-bottom: 8px solid #A9D6E5;
            margin-bottom: 25px;
            position: relative;
        }
        .train {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            width: fit-content;
            margin: 0 auto;
        }
        .train-car {
            background-color: var(--primary);
            color: white;
            font-size: 3.8rem;
            font-weight: bold;
            padding: 15px 35px;
            border-radius: 18px 18px 0 0;
            border: 5px solid #C13D41;
            cursor: pointer;
            box-shadow: inset 0 -10px 0 rgba(0,0,0,0.2);
            transition: background-color 0.2s, transform 0.1s;
            text-align: center;
            min-width: 50px;
        }
        .train-car:active {
            transform: scale(0.9);
        }
        .train-car.correct-hint {
            background-color: var(--tertiary) !important;
            border-color: #6BAA1C !important;
            animation: pulseHint 0.8s infinite;
        }
        .answer-board {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 25px;
        }
        .answer-slot {
            width: 85px;
            height: 95px;
            border: 5px dashed var(--quaternary);
            border-radius: 18px;
            font-size: 4rem;
            line-height: 95px;
            font-weight: bold;
            color: var(--quaternary);
            background-color: #FAFAFA;
            transition: all 0.2s ease-in-out;
        }

        /* --- Tab 4: Match Game --- */
        .match-container {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 20px;
        }
        .match-column {
            display: flex;
            flex-direction: column;
            gap: 18px;
            width: 46%;
        }
        .match-item {
            background-color: #FFF;
            border: 4px solid var(--quaternary);
            border-radius: 18px;
            padding: 18px;
            font-size: 2.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 8px rgba(0,0,0,0.08);
            user-select: none;
        }
        .match-item:hover {
            background-color: #E8F4FA;
        }
        .match-item.selected {
            background-color: var(--secondary);
            border-color: #E5B532;
            transform: scale(1.04);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }
        .match-item.matched {
            background-color: var(--tertiary);
            color: white;
            border-color: #6BAA1C;
            pointer-events: none;
            opacity: 0.85;
            transform: scale(0.96);
            box-shadow: none;
        }
        .match-item span {
            pointer-events: none;
        }

        /* Confetti Overlay */
        #confetti {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1000;
        }
        .confetti-piece {
            position: absolute;
            width: 18px; height: 18px;
            animation: fall linear forwards;
            border-radius: 4px;
        }
        @keyframes fall {
            to { transform: translateY(100vh) rotate(720deg); }
        }

        @media (max-width: 768px) {
            h1 { font-size: 2.5rem; margin-top: 75px; }
            .tab-btn { font-size: 1.3rem; padding: 10px 15px; }
            .slide-text { font-size: 2.4rem; }
            .slide-emoji { font-size: 4.5rem; }
            .search-word { font-size: 1.8rem; padding: 12px 6px; }
            .match-column { width: 100%; }
            .match-item { font-size: 1.7rem; }
            .train-car { font-size: 2.8rem; padding: 10px 22px; }
            .answer-slot { width: 65px; height: 75px; line-height: 75px; font-size: 3rem; }
        }
    </style>
</head>
<body>

    <!-- Floating Sound Toggle Button -->
    <button id="soundToggleBtn" class="sound-toggle" onclick="toggleSound()">🔊 Sound: ON</button>

    <!-- App Title -->
    <h1 class="readable-text" onclick="speak('Learning the word you')">✨ Learning "you" ✨</h1>

    <!-- 4 Navigation Tabs -->
    <div class="tabs">
        <button class="tab-btn active" onclick="openTab('learningTab', this)">📖 Read</button>
        <button class="tab-btn" onclick="openTab('searchTab', this)">🔍 Find</button>
        <button class="tab-btn" onclick="openTab('writeTab', this)">🚂 Write</button>
        <button class="tab-btn" onclick="openTab('matchTab', this)">🧩 Match</button>
    </div>

    <!-- TAB 1: READ (SLIDESHOW) -->
    <div id="learningTab" class="tab-content active">
        <!-- Slide 1: Word Alone -->
        <div class="slide active">
            <div class="slide-emoji">🔊</div>
            <div class="slide-text readable-text" onclick="speak(this.innerText)">
                <span class="syl-a">you</span>
            </div>
            <br>
            <button class="big-btn" onclick="speak('you')">Play Sound</button>
        </div>

        <!-- Slide 2: Sentence 1 -->
        <div class="slide">
            <div class="slide-emoji">🌟 💪</div>
            <div class="slide-text readable-text" onclick="speak(this.innerText)">
                <span class="syl-a">You</span> 
                <span class="syl-b">can</span> 
                <span class="syl-a">do</span> 
                <span class="syl-b">it!</span>
            </div>
        </div>

        <!-- Slide 3: Sentence 2 -->
        <div class="slide">
            <div class="slide-emoji">🦒 📏</div>
            <div class="slide-text readable-text" onclick="speak(this.innerText)">
                <span class="syl-a">You</span> 
                <span class="syl-b">are</span> 
                <span class="syl-a">tall!</span>
            </div>
        </div>

        <!-- Slide 4: Sentence 3 -->
        <div class="slide">
            <div class="slide-emoji">👋 😊</div>
            <div class="slide-text readable-text" onclick="speak(this.innerText)">
                <span class="syl-a">How</span> 
                <span class="syl-b">are</span> 
                <span class="syl-a">you?</span>
            </div>
        </div>

        <!-- Slide 5: Sentence 4 -->
        <div class="slide">
            <div class="slide-emoji">✅ 🏆</div>
            <div class="slide-text readable-text" onclick="speak(this.innerText)">
                <span class="syl-a">Have</span> 
                <span class="syl-b">you</span> 
                <span class="syl-a">done</span> 
                <span class="syl-b">it?</span>
            </div>
        </div>

        <!-- Slide 6: Sentence 5 -->
        <div class="slide">
            <div class="slide-emoji">🎁 🤲</div>
            <div class="slide-text readable-text" onclick="speak(this.innerText)">
                <span class="syl-a">You</span> 
                <span class="syl-b">can</span> 
                <span class="syl-a">have</span> 
                <span class="syl-b">it.</span>
            </div>
        </div>

        <div class="slide-controls">
            <button class="big-btn" onclick="changeSlide(-1)">⬅️ Back</button>
            <div class="dots" id="slideDots"></div>
            <button class="big-btn" onclick="changeSlide(1)">Next ➡️</button>
        </div>
    </div>

    <!-- TAB 2: FIND (SEARCH GAME) -->
    <div id="searchTab" class="tab-content">
        <h2 class="readable-text" onclick="speak(this.innerText)" style="color: var(--quaternary); font-size: 2.8rem; margin-top: 0;">Find "you" 5 times!</h2>
        <div id="timer">Level <span id="levelNum">1</span> ⏱️ Time: <span id="timeText">60</span>s</div>
        <div class="word-grid" id="searchGrid"></div>
        <div id="searchFeedback" class="readable-text" onclick="speak(this.innerText)" style="font-size: 2.4rem; margin-top: 15px; font-weight: bold; color: var(--primary); min-height: 45px;"></div>
    </div>

    <!-- TAB 3: WRITE (TRAIN GAME) -->
    <div id="writeTab" class="tab-content">
        <h2 class="readable-text" onclick="speak(this.innerText)" style="color: var(--quaternary); font-size: 2.8rem; margin-top: 0;">Catch the letters for "you"!</h2>
        <p style="font-size: 2rem; color: var(--primary); font-weight: bold; margin: 10px 0;">Round: <span id="writeRound">1</span> / 5</p>
        <div class="train-container">
            <div class="train" id="trainCars"></div>
        </div>
        <div class="answer-board" id="answerBoard"></div>
        <div id="writeFeedback" class="readable-text" onclick="speak(this.innerText)" style="font-size: 2.3rem; margin-top: 25px; font-weight: bold; min-height: 45px;"></div>
    </div>

    <!-- TAB 4: MATCH GAME -->
    <div id="matchTab" class="tab-content">
        <h2 class="readable-text" onclick="speak(this.innerText)" style="color: var(--quaternary); font-size: 2.8rem; margin-top: 0;">Match the sentence to the picture!</h2>
        <div class="match-container">
            <div class="match-column" id="sentencesCol"></div>
            <div class="match-column" id="emojisCol"></div>
        </div>
    </div>

    <!-- Confetti Canvas/Container -->
    <div id="confetti"></div>

    <script>
        // --- GLOBAL SOUND & TTS SYSTEM ---
        let soundEnabled = true;
        let kidFriendlyVoice = null;

        function toggleSound() {
            soundEnabled = !soundEnabled;
            const btn = document.getElementById('soundToggleBtn');
            if (soundEnabled) {
                btn.innerHTML = "🔊 Sound: ON";
                btn.classList.remove('off');
                speak("Sound on");
            } else {
                window.speechSynthesis.cancel();
                btn.innerHTML = "🔇 Sound: OFF";
                btn.classList.add('off');
            }
        }

        function loadVoices() {
            if (!('speechSynthesis' in window)) return;
            const voices = window.speechSynthesis.getVoices();
            kidFriendlyVoice = voices.find(voice => 
                voice.name.includes('Google US English') ||
                voice.name.includes('Samantha') ||
                voice.name.includes('Victoria') ||
                voice.name.includes('Karen') ||
                voice.name.includes('Zira') ||
                (voice.lang.startsWith('en') && voice.name.toLowerCase().includes('female'))
            );
            if (!kidFriendlyVoice) {
                kidFriendlyVoice = voices.find(v => v.lang.startsWith('en'));
            }
        }

        if ('speechSynthesis' in window) {
            loadVoices();
            window.speechSynthesis.onvoiceschanged = loadVoices;
        }

        function speak(text) {
            if (!soundEnabled || !('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            
            // Clean text from emojis for smoother speech output
            const cleanText = text.replace(/([\u2700-\u27BF]|[\uE000-\uF8FF]|\uD83C[\uDC00-\uDFFF]|\uD83D[\uDC00-\uDFFF]|[\u2011-\u26FF]|\uD83E[\uDD10-\uDDFF])/g, '').trim();
            if (!cleanText) return;

            const msg = new SpeechSynthesisUtterance(cleanText);
            if (kidFriendlyVoice) {
                msg.voice = kidFriendlyVoice;
            }
            msg.rate = 0.80;   // Kid-paced tempo
            msg.pitch = 1.15;  // Friendly higher pitch
            msg.volume = 1.0;
            window.speechSynthesis.speak(msg);
        }

        function shuffleArray(array) {
            const arr = [...array];
            let currentIndex = arr.length, randomIndex;
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [arr[currentIndex], arr[randomIndex]] = [arr[randomIndex], arr[currentIndex]];
            }
            return arr;
        }

        function triggerConfetti() {
            const container = document.getElementById('confetti');
            const colors = ['#FF595E', '#FFCA3A', '#8AC926', '#1982C4', '#6A4C93'];
            for (let i = 0; i < 55; i++) {
                const piece = document.createElement('div');
                piece.className = 'confetti-piece';
                piece.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                piece.style.left = Math.random() * 100 + 'vw';
                piece.style.top = '-20px';
                piece.style.animationDuration = (Math.random() * 1.5 + 1.5) + 's';
                if (Math.random() > 0.5) {
                    piece.style.borderRadius = "50%";
                }
                container.appendChild(piece);
                setTimeout(() => piece.remove(), 3200);
            }
        }

        function openTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');

            if (tabId === 'learningTab') readCurrentSlide();
            if (tabId === 'searchTab') initSearchGame(1);
            if (tabId === 'writeTab') initWriteGame();
            if (tabId === 'matchTab') initMatchGame();
        }

        // --- TAB 1: READ (SLIDESHOW) LOGIC ---
        let currentSlide = 0;
        const slides = document.querySelectorAll('.slide');
        const dotsContainer = document.getElementById('slideDots');

        slides.forEach((_, i) => {
            const dot = document.createElement('div');
            dot.className = i === 0 ? 'dot active' : 'dot';
            dotsContainer.appendChild(dot);
        });
        const dots = document.querySelectorAll('.dot');

        function changeSlide(dir) {
            slides[currentSlide].classList.remove('active');
            dots[currentSlide].classList.remove('active');

            currentSlide += dir;
            if (currentSlide < 0) currentSlide = slides.length - 1;
            if (currentSlide >= slides.length) currentSlide = 0;

            slides[currentSlide].classList.add('active');
            dots[currentSlide].classList.add('active');
            readCurrentSlide();
        }

        function readCurrentSlide() {
            if (currentSlide === 0) {
                speak("you");
            } else {
                const text = slides[currentSlide].querySelector('.slide-text').innerText;
                speak(text);
            }
        }

        // Auto read on initial launch
        window.onload = () => {
            setTimeout(() => {
                if (document.getElementById('learningTab').classList.contains('active')) {
                    readCurrentSlide();
                }
            }, 500);
        };

        // --- TAB 2: FIND (SEARCH GAME) LOGIC ---
        let searchLevel = 1;
        let searchTimer = null;
        let timeLeft = 60;
        let foundCount = 0;
        // 10 Decoy words derived directly from the sentences
        const decoys = ["can", "do", "it", "are", "tall", "How", "Have", "done", "have", "you'll"];

        function initSearchGame(level) {
            clearInterval(searchTimer);
            searchLevel = level;
            timeLeft = 60;
            foundCount = 0;
            document.getElementById('levelNum').innerText = level;
            document.getElementById('timeText').innerText = timeLeft;
            document.getElementById('searchFeedback').innerText = "";

            const grid = document.getElementById('searchGrid');
            grid.innerHTML = "";

            const totalWords = level === 1 ? 9 : (level === 2 ? 16 : 25);
            grid.style.gridTemplateColumns = `repeat(${Math.sqrt(totalWords)}, 1fr)`;

            // 5 target words "you" + random decoys
            let words = ["you", "you", "you", "you", "you"];
            while (words.length < totalWords) {
                words.push(decoys[Math.floor(Math.random() * decoys.length)]);
            }
            words = shuffleArray(words);

            words.forEach(word => {
                const btn = document.createElement('button');
                btn.className = 'search-word';
                btn.innerText = word;
                btn.onclick = () => handleSearchClick(btn, word);
                grid.appendChild(btn);
            });

            searchTimer = setInterval(() => {
                timeLeft--;
                document.getElementById('timeText').innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(searchTimer);
                    speak("Time is up! Let's try again.");
                    document.getElementById('searchFeedback').innerText = "Time's up! Let's try again! ⏳";
                    setTimeout(() => initSearchGame(searchLevel), 2800);
                }
            }, 1000);

            speak(`Level ${level}. Find the word 'you' five times!`);
        }

        function handleSearchClick(btn, word) {
            if (word.toLowerCase() === "you") {
                if (btn.classList.contains('found')) return;

                btn.classList.add('found');
                speak("you");
                foundCount++;
                triggerConfetti();

                if (foundCount === 5) {
                    clearInterval(searchTimer);
                    document.getElementById('searchFeedback').style.color = "var(--tertiary)";
                    document.getElementById('searchFeedback').innerText = "Great Job! 🎉";
                    speak("Great Job!");

                    if (searchLevel < 3) {
                        setTimeout(() => initSearchGame(searchLevel + 1), 2200);
                    } else {
                        document.getElementById('searchFeedback').innerText = "You beat all levels! You are a champion! 🏆";
                        speak("You beat all levels! You are a champion!");
                    }
                }
            } else {
                btn.classList.add('wrong');
                speak("Oops, look for you.");
                document.getElementById('searchFeedback').style.color = "var(--primary)";
                document.getElementById('searchFeedback').innerText = "Oops! Look for 'you'!";

                setTimeout(() => {
                    btn.classList.remove('wrong');
                    document.getElementById('searchFeedback').innerText = "";
                }, 1400);

                // Pulse the target word as a helpful hint
                document.querySelectorAll('.search-word').forEach(wBtn => {
                    if (wBtn.innerText.toLowerCase() === "you" && !wBtn.classList.contains('found')) {
                        wBtn.classList.add('hint');
                        setTimeout(() => wBtn.classList.remove('hint'), 1400);
                    }
                });
            }
        }

        // --- TAB 3: WRITE (TRAIN GAME) LOGIC ---
        // Dynamically configured for the exact target word "you"
        const targetWord = ['y', 'o', 'u'];
        let currentWriteIndex = 0;
        let writeRounds = 1;

        function initWriteGame() {
            currentWriteIndex = 0;
            document.getElementById('writeRound').innerText = writeRounds;
            document.getElementById('writeFeedback').innerText = "";
            document.getElementById('writeFeedback').style.color = "var(--quaternary)";

            // Dynamically generate slots for targetWord length
            const board = document.getElementById('answerBoard');
            board.innerHTML = "";
            for (let i = 0; i < targetWord.length; i++) {
                const slot = document.createElement('div');
                slot.className = 'answer-slot';
                slot.id = 'slot' + i;
                board.appendChild(slot);
            }

            const train = document.getElementById('trainCars');
            train.innerHTML = "";

            // Create 5 random letter decoys not included in target word letters
            const alphabet = "abcdefghijklmnopqrstuvwxyz".split("").filter(letter => !targetWord.includes(letter));
            const randomDecoys = shuffleArray(alphabet).slice(0, 5);

            // Combine target letters and 5 random decoys, then shuffle
            const gameLetters = shuffleArray([...targetWord, ...randomDecoys]);

            gameLetters.forEach(letter => {
                const car = document.createElement('div');
                car.className = 'train-car';
                car.innerText = letter;
                car.onclick = () => handleTrainClick(letter, car);
                train.appendChild(car);
            });

            speak("Catch the letters to spell 'you'!");
        }

        function handleTrainClick(letter, carElement) {
            if (currentWriteIndex >= targetWord.length) return;

            if (letter === targetWord[currentWriteIndex]) {
                const slot = document.getElementById('slot' + currentWriteIndex);
                slot.innerText = letter;
                slot.style.backgroundColor = "#E8F4FA";
                slot.style.borderColor = "var(--tertiary)";
                slot.style.color = "var(--tertiary)";
                speak(letter);
                currentWriteIndex++;

                if (currentWriteIndex === targetWord.length) {
                    speak("you! You did it!");
                    triggerConfetti();
                    document.getElementById('writeFeedback').style.color = "var(--tertiary)";
                    document.getElementById('writeFeedback').innerText = "Perfect! 🎉";
                    writeRounds++;

                    if (writeRounds <= 5) {
                        setTimeout(initWriteGame, 2500);
                    } else {
                        document.getElementById('writeFeedback').innerText = "You wrote it 5 times! You win! 🏆";
                        speak("You wrote it five times! You win!");
                        writeRounds = 1;
                    }
                }
            } else {
                const neededLetter = targetWord[currentWriteIndex];
                speak(`Try again, we need the letter ${neededLetter}`);
                document.getElementById('writeFeedback').style.color = "var(--primary)";
                document.getElementById('writeFeedback').innerText = `Oops! We need "${neededLetter}" next!`;

                carElement.style.backgroundColor = "#444";
                carElement.style.borderColor = "#222";

                document.querySelectorAll('.train-car').forEach(c => {
                    if (c.innerText === neededLetter) {
                        c.classList.add('correct-hint');
                        setTimeout(() => c.classList.remove('correct-hint'), 1400);
                    }
                });

                setTimeout(() => {
                    carElement.style.backgroundColor = "var(--primary)";
                    carElement.style.borderColor = "#C13D41";
                    document.getElementById('writeFeedback').innerText = "";
                }, 1400);
            }
        }

        // --- TAB 4: MATCH GAME LOGIC ---
        // 5 syntax-corrected sentences with color-coded syllables and matching emoji pairs
        const pairs = [
            { 
                text: "You can do it!", 
                html: '<span class="syl-a">You</span> <span class="syl-b">can</span> <span class="syl-a">do</span> <span class="syl-b">it!</span>', 
                img: "🌟 💪" 
            },
            { 
                text: "You are tall!", 
                html: '<span class="syl-a">You</span> <span class="syl-b">are</span> <span class="syl-a">tall!</span>', 
                img: "🦒 📏" 
            },
            { 
                text: "How are you?", 
                html: '<span class="syl-a">How</span> <span class="syl-b">are</span> <span class="syl-a">you?</span>', 
                img: "👋 😊" 
            },
            { 
                text: "Have you done it?", 
                html: '<span class="syl-a">Have</span> <span class="syl-b">you</span> <span class="syl-a">done</span> <span class="syl-b">it?</span>', 
                img: "✅ 🏆" 
            },
            { 
                text: "You can have it.", 
                html: '<span class="syl-a">You</span> <span class="syl-b">can</span> <span class="syl-a">have</span> <span class="syl-b">it.</span>', 
                img: "🎁 🤲" 
            }
        ];

        let selectedSentence = null;
        let selectedEmoji = null;
        let matchesFound = 0;

        function initMatchGame() {
            selectedSentence = null;
            selectedEmoji = null;
            matchesFound = 0;

            const sCol = document.getElementById('sentencesCol');
            const eCol = document.getElementById('emojisCol');
            sCol.innerHTML = "";
            eCol.innerHTML = "";

            // Both columns independently shuffled on load
            const shuffledSentences = shuffleArray(pairs);
            const shuffledEmojis = shuffleArray(pairs);

            shuffledSentences.forEach(p => {
                const div = document.createElement('div');
                div.className = 'match-item';
                div.innerHTML = p.html;
                div.onclick = () => handleMatchClick('text', p.text, div);
                sCol.appendChild(div);
            });

            shuffledEmojis.forEach(p => {
                const div = document.createElement('div');
                div.className = 'match-item';
                div.style.fontSize = "3.8rem";
                div.innerText = p.img;
                div.onclick = () => handleMatchClick('img', p.img, div);
                eCol.appendChild(div);
            });

            speak("Match the sentence to the picture!");
        }

        function handleMatchClick(type, value, element) {
            if (element.classList.contains('matched')) return;

            if (type === 'text') {
                if (selectedSentence) selectedSentence.el.classList.remove('selected');
                selectedSentence = { val: value, el: element };
                element.classList.add('selected');
                speak(value);
            } else {
                if (selectedEmoji) selectedEmoji.el.classList.remove('selected');
                selectedEmoji = { val: value, el: element };
                element.classList.add('selected');
            }

            if (selectedSentence && selectedEmoji) {
                const matchFound = pairs.find(p => p.text === selectedSentence.val && p.img === selectedEmoji.val);

                if (matchFound) {
                    selectedSentence.el.classList.replace('selected', 'matched');
                    selectedEmoji.el.classList.replace('selected', 'matched');
                    triggerConfetti();
                    speak("Great match!");
                    matchesFound++;

                    if (matchesFound === pairs.length) {
                        setTimeout(() => {
                            speak("You matched all of them! You win!");
                            initMatchGame();
                        }, 2800);
                    }
                } else {
                    selectedSentence.el.style.borderColor = "var(--primary)";
                    selectedSentence.el.style.backgroundColor = "#FFE8E8";
                    selectedEmoji.el.style.borderColor = "var(--primary)";
                    selectedEmoji.el.style.backgroundColor = "#FFE8E8";

                    speak("Try again!");

                    setTimeout(() => {
                        if (selectedSentence) {
                            selectedSentence.el.style.borderColor = "";
                            selectedSentence.el.style.backgroundColor = "";
                            selectedSentence.el.classList.remove('selected');
                        }
                        if (selectedEmoji) {
                            selectedEmoji.el.style.borderColor = "";
                            selectedEmoji.el.style.backgroundColor = "";
                            selectedEmoji.el.classList.remove('selected');
                        }
                        selectedSentence = null;
                        selectedEmoji = null;
                    }, 1100);
                    return;
                }

                selectedSentence = null;
                selectedEmoji = null;
            }
        }
    </script>
</body>
</html>
