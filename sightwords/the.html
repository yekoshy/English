<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learn the word "the"</title>
    <style>
        /* Light, Colorful Theme & Big Fonts */
        :root {
            --bg-color: #F0F8FF;
            --primary: #FF595E;
            --secondary: #FFCA3A;
            --tertiary: #8AC926;
            --quaternary: #1982C4;
            --text-color: #333;
            --white: #FFF;
        }

        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Fredoka One', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 10px;
            text-align: center;
            overflow-x: hidden;
        }

        h1 {
            color: var(--primary);
            font-size: 3rem;
            margin-bottom: 10px;
        }

        /* Tabs Navigation */
        .tabs {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            background-color: var(--white);
            border: 4px solid var(--quaternary);
            border-radius: 20px;
            padding: 15px 20px;
            font-size: 1.5rem;
            font-family: inherit;
            font-weight: bold;
            color: var(--quaternary);
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 0 var(--quaternary);
        }

        .tab-btn:hover, .tab-btn.active {
            background-color: var(--quaternary);
            color: var(--white);
            transform: translateY(2px);
            box-shadow: 0 2px 0 var(--quaternary);
        }

        .tab-content {
            display: none;
            background-color: var(--white);
            border-radius: 30px;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Shared Button Styles */
        button {
            font-family: inherit;
            cursor: pointer;
        }

        .big-btn {
            background-color: var(--tertiary);
            color: white;
            border: none;
            border-radius: 15px;
            padding: 15px 30px;
            font-size: 1.8rem;
            font-weight: bold;
            margin: 10px;
            box-shadow: 0 5px 0 #6BAA1C;
        }

        .big-btn:active {
            transform: translateY(5px);
            box-shadow: none;
        }

        /* --- Tab 1: Learning --- */
        .slide {
            display: none;
            padding: 20px;
        }
        .slide.active {
            display: block;
        }
        .slide-emoji {
            font-size: 8rem;
            margin: 10px 0;
        }
        .slide-text {
            font-size: 3rem;
            color: var(--quaternary);
            margin: 20px 0;
        }
        .slide-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 20px;
        }
        .dots {
            display: flex;
            gap: 10px;
        }
        .dot {
            width: 20px;
            height: 20px;
            background-color: #DDD;
            border-radius: 50%;
        }
        .dot.active {
            background-color: var(--primary);
        }

        /* --- Tab 2: Search Game --- */
        #timer {
            font-size: 2rem;
            color: var(--primary);
            font-weight: bold;
        }
        .word-grid {
            display: grid;
            gap: 15px;
            margin: 20px auto;
            max-width: 600px;
        }
        .search-word {
            background-color: var(--secondary);
            border: 3px solid #E5B532;
            border-radius: 15px;
            font-size: 2rem;
            padding: 20px;
            font-weight: bold;
            color: var(--text-color);
            cursor: pointer;
            transition: 0.2s;
        }
        .search-word.found {
            background-color: var(--tertiary);
            color: white;
            border-color: #6BAA1C;
            transform: scale(0.95);
            pointer-events: none;
        }
        .search-word.wrong {
            background-color: var(--primary);
            color: white;
            animation: shake 0.3s;
        }
        .hint {
            border: 4px solid var(--tertiary) !important;
            animation: pulseHint 1s infinite;
        }
        @keyframes pulseHint { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }

        /* --- Tab 3: Train Write Game --- */
        .train-container {
            overflow: hidden;
            background: #E8F4FA;
            padding: 20px;
            border-radius: 20px;
            border-bottom: 5px solid #CCC;
            margin-bottom: 20px;
            position: relative;
        }
        .train {
            display: flex;
            gap: 10px;
            width: max-content;
            animation: moveTrain 8s linear infinite alternate;
        }
        @keyframes moveTrain {
            0% { transform: translateX(0); }
            100% { transform: translateX(50%); }
        }
        .train-car {
            background-color: var(--primary);
            color: white;
            font-size: 3rem;
            font-weight: bold;
            padding: 15px 30px;
            border-radius: 10px 10px 0 0;
            border: 4px solid #C13D41;
            cursor: pointer;
            box-shadow: inset 0 -10px 0 rgba(0,0,0,0.2);
        }
        .answer-board {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }
        .answer-slot {
            width: 60px;
            height: 70px;
            border: 4px dashed var(--quaternary);
            border-radius: 10px;
            font-size: 3rem;
            line-height: 70px;
            font-weight: bold;
            color: var(--quaternary);
        }

        /* --- Tab 4: Match Game --- */
        .match-container {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 20px;
        }
        .match-column {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 45%;
        }
        .match-item {
            background-color: #FFF;
            border: 3px solid var(--quaternary);
            border-radius: 15px;
            padding: 15px;
            font-size: 2rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .match-item.selected {
            background-color: var(--secondary);
            border-color: #E5B532;
            transform: scale(1.05);
        }
        .match-item.matched {
            background-color: var(--tertiary);
            color: white;
            border-color: #6BAA1C;
            pointer-events: none;
            opacity: 0.7;
        }

        /* Confetti Overlay */
        #confetti {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1000;
        }
        .confetti-piece {
            position: absolute;
            width: 15px; height: 15px;
            animation: fall 2s linear forwards;
        }
        @keyframes fall {
            to { transform: translateY(100vh) rotate(720deg); }
        }
    </style>
</head>
<body>

    <h1>✨ Learning "the" ✨</h1>

    <div class="tabs">
        <button class="tab-btn active" onclick="openTab('learningTab', this)">📖 Read</button>
        <button class="tab-btn" onclick="openTab('searchTab', this)">🔍 Find</button>
        <button class="tab-btn" onclick="openTab('writeTab', this)">🚂 Write</button>
        <button class="tab-btn" onclick="openTab('matchTab', this)">🧩 Match</button>
    </div>

    <!-- TAB 1: LEARNING -->
    <div id="learningTab" class="tab-content active">
        <!-- Slide 1 -->
        <div class="slide active">
            <div class="slide-emoji">🔊</div>
            <div class="slide-text">the</div>
            <button class="big-btn" onclick="speak('the')">Play Sound</button>
        </div>
        <!-- Slide 2 -->
        <div class="slide">
            <div class="slide-emoji">🐈</div>
            <div class="slide-text">the cat sat</div>
        </div>
        <!-- Slide 3 -->
        <div class="slide">
            <div class="slide-emoji">🐕</div>
            <div class="slide-text">the dog ran</div>
        </div>
        <!-- Slide 4 -->
        <div class="slide">
            <div class="slide-emoji">🐞</div>
            <div class="slide-text">the red bug</div>
        </div>
        <!-- Slide 5 -->
        <div class="slide">
            <div class="slide-emoji">☀️</div>
            <div class="slide-text">the sun is hot</div>
        </div>

        <div class="slide-controls">
            <button class="big-btn" onclick="changeSlide(-1)">⬅️ Back</button>
            <div class="dots" id="slideDots"></div>
            <button class="big-btn" onclick="changeSlide(1)">Next ➡️</button>
        </div>
    </div>

    <!-- TAB 2: SEARCH GAME -->
    <div id="searchTab" class="tab-content">
        <h2 style="color: var(--quaternary); font-size: 2.5rem;">Find "the" 5 times!</h2>
        <div id="timer">Level <span id="levelNum">1</span> - Time: <span id="timeText">60</span>s</div>
        <div class="word-grid" id="searchGrid"></div>
        <div id="searchFeedback" style="font-size: 2rem; margin-top: 10px; color: var(--primary);"></div>
    </div>

    <!-- TAB 3: WRITE THE WORD TRAIN -->
    <div id="writeTab" class="tab-content">
        <h2 style="color: var(--quaternary); font-size: 2.5rem;">Catch the letters for "the"!</h2>
        <p style="font-size: 1.5rem;">Round: <span id="writeRound">1</span>/5</p>
        <div class="train-container">
            <div class="train" id="trainCars">
                <!-- Cars generated by JS -->
            </div>
        </div>
        <div class="answer-board" id="answerBoard">
            <div class="answer-slot" id="slot0"></div>
            <div class="answer-slot" id="slot1"></div>
            <div class="answer-slot" id="slot2"></div>
        </div>
        <div id="writeFeedback" style="font-size: 2rem; margin-top: 20px; font-weight:bold;"></div>
    </div>

    <!-- TAB 4: MATCHING GAME -->
    <div id="matchTab" class="tab-content">
        <h2 style="color: var(--quaternary); font-size: 2.5rem;">Match the sentence to the picture!</h2>
        <div class="match-container">
            <div class="match-column" id="sentencesCol"></div>
            <div class="match-column" id="emojisCol"></div>
        </div>
    </div>

    <!-- Confetti Container -->
    <div id="confetti"></div>

    <script>
        // --- GLOBAL FUNCTIONS ---
        function speak(text) {
            if ('speechSynthesis' in window) {
                // Cancel any ongoing speech
                window.speechSynthesis.cancel();
                const msg = new SpeechSynthesisUtterance(text);
                msg.rate = 0.8; // Slower for kids
                msg.pitch = 1.2;
                window.speechSynthesis.speak(msg);
            }
        }

        function triggerConfetti() {
            const container = document.getElementById('confetti');
            const colors = ['#FF595E', '#FFCA3A', '#8AC926', '#1982C4', '#6A4C93'];
            for(let i=0; i<40; i++) {
                const piece = document.createElement('div');
                piece.className = 'confetti-piece';
                piece.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                piece.style.left = Math.random() * 100 + 'vw';
                piece.style.top = '-20px';
                piece.style.animationDuration = (Math.random() * 1 + 1.5) + 's';
                container.appendChild(piece);
                setTimeout(() => piece.remove(), 3000);
            }
        }

        function openTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');

            if(tabId === 'learningTab') readCurrentSlide();
            if(tabId === 'searchTab') initSearchGame(1);
            if(tabId === 'writeTab') initWriteGame();
            if(tabId === 'matchTab') initMatchGame();
        }

        // --- TAB 1: LEARNING LOGIC ---
        let currentSlide = 0;
        const slides = document.querySelectorAll('.slide');
        const dotsContainer = document.getElementById('slideDots');

        // Create dots
        slides.forEach((s, i) => {
            const dot = document.createElement('div');
            dot.className = i === 0 ? 'dot active' : 'dot';
            dotsContainer.appendChild(dot);
        });
        const dots = document.querySelectorAll('.dot');

        function changeSlide(dir) {
            slides[currentSlide].classList.remove('active');
            dots[currentSlide].classList.remove('active');
            
            currentSlide += dir;
            if (currentSlide < 0) currentSlide = slides.length - 1;
            if (currentSlide >= slides.length) currentSlide = 0;

            slides[currentSlide].classList.add('active');
            dots[currentSlide].classList.add('active');
            readCurrentSlide();
        }

        function readCurrentSlide() {
            if(currentSlide === 0) {
                speak("the");
            } else {
                const text = slides[currentSlide].querySelector('.slide-text').innerText;
                speak(text);
            }
        }

        // --- TAB 2: SEARCH GAME LOGIC ---
        let searchLevel = 1;
        let searchTimer;
        let timeLeft = 60;
        let foundCount = 0;
        const decoys = ["and", "cat", "dog", "bug", "sun", "hot", "sat", "ran", "red"];

        function initSearchGame(level) {
            clearInterval(searchTimer);
            searchLevel = level;
            timeLeft = 60;
            foundCount = 0;
            document.getElementById('levelNum').innerText = level;
            document.getElementById('timeText').innerText = timeLeft;
            document.getElementById('searchFeedback').innerText = "";

            const grid = document.getElementById('searchGrid');
            grid.innerHTML = "";

            // Level 1: 9 words (3x3), Level 2: 16 words (4x4), Level 3: 25 words (5x5)
            let totalWords = level === 1 ? 9 : (level === 2 ? 16 : 25);
            grid.style.gridTemplateColumns = `repeat(${Math.sqrt(totalWords)}, 1fr)`;

            let words = ["the", "the", "the", "the", "the"];
            while(words.length < totalWords) {
                words.push(decoys[Math.floor(Math.random() * decoys.length)]);
            }
            words = words.sort(() => Math.random() - 0.5); // Shuffle

            words.forEach(word => {
                const btn = document.createElement('button');
                btn.className = 'search-word';
                btn.innerText = word;
                btn.onclick = () => handleSearchClick(btn, word);
                grid.appendChild(btn);
            });

            searchTimer = setInterval(() => {
                timeLeft--;
                document.getElementById('timeText').innerText = timeLeft;
                if(timeLeft <= 0) {
                    clearInterval(searchTimer);
                    document.getElementById('searchFeedback').innerText = "Time's up! Let's try again! ⏳";
                    setTimeout(() => initSearchGame(searchLevel), 3000);
                }
            }, 1000);
        }

        function handleSearchClick(btn, word) {
            if (word === "the") {
                btn.classList.add('found');
                speak("the");
                foundCount++;
                triggerConfetti();
                if (foundCount === 5) {
                    clearInterval(searchTimer);
                    document.getElementById('searchFeedback').innerText = "Great Job! 🎉";
                    if (searchLevel < 3) {
                        setTimeout(() => initSearchGame(searchLevel + 1), 2000);
                    } else {
                        document.getElementById('searchFeedback').innerText = "You beat all levels! 🏆";
                    }
                }
            } else {
                btn.classList.add('wrong');
                speak("Oops!");
                document.getElementById('searchFeedback').innerText = "Look for 'the'!";
                setTimeout(() => {
                    btn.classList.remove('wrong');
                    document.getElementById('searchFeedback').innerText = "";
                }, 1000);

                // Highlight correct answers to help
                document.querySelectorAll('.search-word').forEach(wBtn => {
                    if (wBtn.innerText === "the" && !wBtn.classList.contains('found')) {
                        wBtn.classList.add('hint');
                        setTimeout(() => wBtn.classList.remove('hint'), 1500);
                    }
                });
            }
        }

        // --- TAB 3: WRITE GAME LOGIC ---
        let currentWriteIndex = 0;
        let writeRounds = 1;
        const targetWord = ['t', 'h', 'e'];
        
        function initWriteGame() {
            currentWriteIndex = 0;
            document.getElementById('writeRound').innerText = writeRounds;
            document.getElementById('writeFeedback').innerText = "";
            document.getElementById('writeFeedback').style.color = "var(--quaternary)";
            
            // Reset answer slots
            for(let i=0; i<3; i++) {
                document.getElementById('slot'+i).innerText = "";
                document.getElementById('slot'+i).style.backgroundColor = "transparent";
            }

            const train = document.getElementById('trainCars');
            train.innerHTML = "";
            
            // Add letters (t,h,e + decoys)
            let letters = ['t', 'h', 'e', 'a', 'r'];
            letters = letters.sort(() => Math.random() - 0.5);

            letters.forEach(letter => {
                const car = document.createElement('div');
                car.className = 'train-car';
                car.innerText = letter;
                car.onclick = () => handleTrainClick(letter, car);
                train.appendChild(car);
            });
        }

        function handleTrainClick(letter, carElement) {
            if (currentWriteIndex >= 3) return;

            // Check if correct letter in order
            if (letter === targetWord[currentWriteIndex]) {
                document.getElementById('slot' + currentWriteIndex).innerText = letter;
                document.getElementById('slot' + currentWriteIndex).style.backgroundColor = "#E8F4FA";
                speak(letter);
                currentWriteIndex++;

                if (currentWriteIndex === 3) {
                    speak("the");
                    triggerConfetti();
                    document.getElementById('writeFeedback').style.color = "var(--tertiary)";
                    document.getElementById('writeFeedback').innerText = "Perfect! 🎉";
                    writeRounds++;
                    if (writeRounds <= 5) {
                        setTimeout(initWriteGame, 2000);
                    } else {
                        document.getElementById('writeFeedback').innerText = "You wrote it 5 times! You win! 🏆";
                        writeRounds = 1; // Reset for next time tab opens
                    }
                }
            } else {
                speak("Try again!");
                document.getElementById('writeFeedback').style.color = "var(--primary)";
                document.getElementById('writeFeedback').innerText = `Oops! We need "${targetWord[currentWriteIndex]}" next!`;
                carElement.style.backgroundColor = "var(--text-color)";
                setTimeout(() => {
                    carElement.style.backgroundColor = "var(--primary)";
                    document.getElementById('writeFeedback').innerText = "";
                }, 1500);
            }
        }

        // --- TAB 4: MATCH GAME LOGIC ---
        const pairs = [
            { text: "the cat sat", img: "🐈" },
            { text: "the dog ran", img: "🐕" },
            { text: "the red bug", img: "🐞" },
            { text: "the sun is hot", img: "☀️" }
        ];
        let selectedSentence = null;
        let selectedEmoji = null;

        function initMatchGame() {
            selectedSentence = null;
            selectedEmoji = null;
            
            const sCol = document.getElementById('sentencesCol');
            const eCol = document.getElementById('emojisCol');
            sCol.innerHTML = "";
            eCol.innerHTML = "";

            let sentences = [...pairs].sort(() => Math.random() - 0.5);
            let emojis = [...pairs].sort(() => Math.random() - 0.5);

            sentences.forEach(p => {
                const div = document.createElement('div');
                div.className = 'match-item';
                div.innerText = p.text;
                div.onclick = () => handleMatchClick('text', p.text, div);
                sCol.appendChild(div);
            });

            emojis.forEach(p => {
                const div = document.createElement('div');
                div.className = 'match-item';
                div.style.fontSize = "4rem";
                div.innerText = p.img;
                div.onclick = () => handleMatchClick('img', p.img, div);
                eCol.appendChild(div);
            });
        }

        function handleMatchClick(type, value, element) {
            if (element.classList.contains('matched')) return;

            // Handle selection visually
            if (type === 'text') {
                if(selectedSentence) selectedSentence.el.classList.remove('selected');
                selectedSentence = { val: value, el: element };
                element.classList.add('selected');
                speak(value);
            } else {
                if(selectedEmoji) selectedEmoji.el.classList.remove('selected');
                selectedEmoji = { val: value, el: element };
                element.classList.add('selected');
            }

            // Check match if both selected
            if (selectedSentence && selectedEmoji) {
                const matchFound = pairs.find(p => p.text === selectedSentence.val && p.img === selectedEmoji.val);
                
                if (matchFound) {
                    selectedSentence.el.classList.replace('selected', 'matched');
                    selectedEmoji.el.classList.replace('selected', 'matched');
                    triggerConfetti();
                    speak("Great match!");
                } else {
                    selectedSentence.el.style.borderColor = "var(--primary)";
                    selectedEmoji.el.style.borderColor = "var(--primary)";
                    speak("Try again!");
                    setTimeout(() => {
                        if(selectedSentence) {
                            selectedSentence.el.style.borderColor = "";
                            selectedSentence.el.classList.remove('selected');
                        }
                        if(selectedEmoji) {
                            selectedEmoji.el.style.borderColor = "";
                            selectedEmoji.el.classList.remove('selected');
                        }
                        selectedSentence = null;
                        selectedEmoji = null;
                    }, 1000);
                    return; // exit early so we don't reset variables immediately below
                }
                
                selectedSentence = null;
                selectedEmoji = null;
            }
        }
    </script>
</body>
</html>
