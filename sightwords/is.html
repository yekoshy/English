<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learn the word "is"</title>
    <style>
        /* Light, Colorful Theme & Big Kid-Friendly Fonts */
        :root {
            --bg-color: #F8F9FA;
            --primary: #FF595E;
            --secondary: #FFCA3A;
            --tertiary: #8AC926;
            --quaternary: #1982C4;
            --text-color: #333;
            --white: #FFF;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Fredoka One', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 10px;
            text-align: center;
            overflow-x: hidden;
        }

        /* Sound Toggle Button */
        .sound-toggle {
            position: fixed;
            top: 15px;
            right: 15px;
            background-color: var(--tertiary);
            color: white;
            border: 4px solid #6BAA1C;
            border-radius: 20px;
            padding: 10px 20px;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 0 #6BAA1C;
            transition: all 0.2s;
            z-index: 1000;
            font-family: inherit;
        }

        .sound-toggle:active {
            transform: translateY(5px);
            box-shadow: none;
        }

        .sound-toggle.off {
            background-color: var(--primary);
            border-color: #C13D41;
            box-shadow: 0 5px 0 #C13D41;
        }

        /* Clickable text for reading aloud */
        .readable-text {
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
            border-radius: 15px;
            display: inline-block;
            padding: 5px 15px;
        }

        .readable-text:hover {
            background-color: rgba(255, 202, 58, 0.35);
            transform: scale(1.03);
        }

        .readable-text:active {
            transform: scale(0.97);
        }

        h1 {
            color: var(--primary);
            font-size: 3.5rem;
            margin-top: 65px;
            margin-bottom: 15px;
            text-shadow: 2px 2px 0px #DDD;
        }

        /* Tabs Navigation */
        .tabs {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 20px;
        }

        .tab-btn {
            background-color: var(--white);
            border: 4px solid var(--quaternary);
            border-radius: 20px;
            padding: 12px 24px;
            font-size: 1.8rem;
            font-family: inherit;
            font-weight: bold;
            color: var(--quaternary);
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 5px 0 var(--quaternary);
        }

        .tab-btn:hover, .tab-btn.active {
            background-color: var(--quaternary);
            color: var(--white);
            transform: translateY(3px);
            box-shadow: 0 2px 0 var(--quaternary);
        }

        .tab-content {
            display: none;
            background-color: var(--white);
            border-radius: 30px;
            padding: 30px;
            max-width: 900px;
            margin: 0 auto;
            box-shadow: 0 10px 20px rgba(0,0,0,0.08);
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Shared Buttons */
        button {
            font-family: inherit;
            cursor: pointer;
        }

        .big-btn {
            background-color: var(--tertiary);
            color: white;
            border: none;
            border-radius: 15px;
            padding: 15px 35px;
            font-size: 2rem;
            font-weight: bold;
            margin: 10px;
            box-shadow: 0 6px 0 #6BAA1C;
            transition: transform 0.1s;
        }

        .big-btn:active {
            transform: translateY(6px);
            box-shadow: none;
        }

        /* Reading Syllables Color Alternation */
        .syl-a { color: var(--primary); }    /* Red */
        .syl-b { color: var(--quaternary); } /* Blue */

        /* --- Tab 1: Learning (Read) --- */
        .slide {
            display: none;
            padding: 20px;
        }
        .slide.active {
            display: block;
            animation: slideIn 0.35s ease-out;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(25px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .slide-emoji {
            font-size: 7rem;
            margin: 10px 0;
            line-height: 1.2;
        }
        .slide-text {
            font-size: 3.5rem;
            margin: 20px 0;
            font-weight: bold;
        }
        .slide-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;
            margin-top: 30px;
            flex-wrap: wrap;
        }
        .dots {
            display: flex;
            gap: 12px;
        }
        .dot {
            width: 22px;
            height: 22px;
            background-color: #E0E0E0;
            border-radius: 50%;
            transition: all 0.3s;
        }
        .dot.active {
            background-color: var(--primary);
            transform: scale(1.25);
        }

        /* --- Tab 2: Search Game --- */
        #timer {
            font-size: 2.2rem;
            color: var(--primary);
            font-weight: bold;
            background: #FFE8E8;
            border-radius: 15px;
            display: inline-block;
            padding: 8px 22px;
            margin-bottom: 15px;
        }
        .word-grid {
            display: grid;
            gap: 15px;
            margin: 20px auto;
            max-width: 680px;
        }
        .search-word {
            background-color: var(--secondary);
            border: 4px solid #E5B532;
            border-radius: 20px;
            font-size: 2.2rem;
            padding: 16px 8px;
            font-weight: bold;
            color: var(--text-color);
            cursor: pointer;
            transition: 0.2s;
        }
        .search-word:hover {
            transform: scale(1.05);
        }
        .search-word.found {
            background-color: var(--tertiary);
            color: white;
            border-color: #6BAA1C;
            transform: scale(0.96);
            pointer-events: none;
        }
        .search-word.wrong {
            background-color: var(--primary);
            color: white;
            border-color: #C13D41;
            animation: shake 0.35s;
        }
        .hint {
            background-color: #8AC926 !important;
            color: white !important;
            border: 5px solid #1982C4 !important;
            animation: pulseHint 0.8s infinite;
            z-index: 5;
        }
        @keyframes pulseHint {
            0% { transform: scale(1); }
            50% { transform: scale(1.12); box-shadow: 0 0 16px var(--quaternary); }
            100% { transform: scale(1); }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-12px); }
            75% { transform: translateX(12px); }
        }

        /* --- Tab 3: Train Write Game --- */
        .train-container {
            background: #E8F4FA;
            padding: 25px;
            border-radius: 20px;
            border-bottom: 8px solid #A9D6E5;
            margin: 20px 0;
        }
        .train {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin: 0 auto;
        }
        .train-car {
            background-color: var(--primary);
            color: white;
            font-size: 3.5rem;
            font-weight: bold;
            padding: 16px 32px;
            border-radius: 16px 16px 4px 4px;
            border: 5px solid #C13D41;
            cursor: pointer;
            box-shadow: inset 0 -8px 0 rgba(0,0,0,0.25);
            transition: background-color 0.2s, transform 0.1s;
            text-align: center;
            user-select: none;
        }
        .train-car:active {
            transform: scale(0.92);
        }
        .train-car.correct-hint {
            background-color: var(--tertiary) !important;
            border-color: #6BAA1C !important;
            animation: pulseHint 0.8s infinite;
        }
        .answer-board {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 25px;
        }
        .answer-slot {
            width: 85px;
            height: 95px;
            border: 5px dashed var(--quaternary);
            border-radius: 15px;
            font-size: 3.8rem;
            line-height: 85px;
            font-weight: bold;
            color: var(--quaternary);
            background-color: #FAFAFA;
        }

        /* --- Tab 4: Match Game --- */
        .match-container {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 25px;
        }
        .match-column {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 48%;
            min-width: 280px;
        }
        .match-item {
            background-color: #FFF;
            border: 4px solid var(--quaternary);
            border-radius: 18px;
            padding: 18px;
            font-size: 2rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 8px rgba(0,0,0,0.08);
            user-select: none;
        }
        .match-item:hover {
            background-color: #E8F4FA;
        }
        .match-item.selected {
            background-color: var(--secondary);
            border-color: #E5B532;
            transform: scale(1.04);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }
        .match-item.matched {
            background-color: var(--tertiary);
            color: white !important;
            border-color: #6BAA1C;
            pointer-events: none;
            opacity: 0.9;
            transform: scale(0.97);
            box-shadow: none;
        }
        .match-item.matched span {
            color: white !important;
        }
        .match-item span {
            pointer-events: none;
        }

        /* Confetti Overlay */
        #confetti {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1001;
        }
        .confetti-piece {
            position: absolute;
            width: 18px; height: 18px;
            animation: fall linear forwards;
            border-radius: 3px;
        }
        @keyframes fall {
            to { transform: translateY(100vh) rotate(720deg); }
        }

        @media (max-width: 600px) {
            h1 { font-size: 2.5rem; margin-top: 80px; }
            .tab-btn { font-size: 1.4rem; padding: 10px 16px; }
            .slide-text { font-size: 2.4rem; }
            .slide-emoji { font-size: 5rem; }
            .search-word { font-size: 1.8rem; padding: 10px; }
            .match-column { width: 100%; }
        }
    </style>
</head>
<body>

    <!-- Floating Sound Toggle Button -->
    <button id="soundToggleBtn" class="sound-toggle" onclick="toggleSound()">🔊 Sound: ON</button>

    <!-- App Title -->
    <h1 class="readable-text" onclick="speak('Learning the word is')">✨ Learning "is" ✨</h1>

    <!-- Tab Navigation -->
    <div class="tabs">
        <button class="tab-btn active" onclick="openTab('learningTab', this)">📖 Read</button>
        <button class="tab-btn" onclick="openTab('searchTab', this)">🔍 Find</button>
        <button class="tab-btn" onclick="openTab('writeTab', this)">🚂 Write</button>
        <button class="tab-btn" onclick="openTab('matchTab', this)">🧩 Match</button>
    </div>

    <!-- TAB 1: READ / LEARNING SLIDESHOW -->
    <div id="learningTab" class="tab-content active">
        <!-- Slide 1: Sightword Intro -->
        <div class="slide active">
            <div class="slide-emoji">🔊 ⭐</div>
            <div class="slide-text readable-text" onclick="speak(this.innerText)">
                <span class="syl-a">is</span>
            </div>
            <br>
            <button class="big-btn" onclick="speak('is')">Play Sound</button>
        </div>

        <!-- Slide 2: He is tall. -->
        <div class="slide">
            <div class="slide-emoji">👦 🦒</div>
            <div class="slide-text readable-text" onclick="speak(this.innerText)">
                <span class="syl-a">He</span> 
                <span class="syl-b">is</span> 
                <span class="syl-a">tall.</span>
            </div>
        </div>

        <!-- Slide 3: She is short. -->
        <div class="slide">
            <div class="slide-emoji">👧 🧸</div>
            <div class="slide-text readable-text" onclick="speak(this.innerText)">
                <span class="syl-a">She</span> 
                <span class="syl-b">is</span> 
                <span class="syl-a">short.</span>
            </div>
        </div>

        <!-- Slide 4: It is happening now. -->
        <div class="slide">
            <div class="slide-emoji">⚡ ⏰</div>
            <div class="slide-text readable-text" onclick="speak(this.innerText)">
                <span class="syl-a">It</span> 
                <span class="syl-b">is</span> 
                <span class="syl-a">hap</span><span class="syl-b">pen</span><span class="syl-a">ing</span> 
                <span class="syl-b">now.</span>
            </div>
        </div>

        <!-- Slide 5: He is happy. -->
        <div class="slide">
            <div class="slide-emoji">👦 😄</div>
            <div class="slide-text readable-text" onclick="speak(this.innerText)">
                <span class="syl-a">He</span> 
                <span class="syl-b">is</span> 
                <span class="syl-a">hap</span><span class="syl-b">py.</span>
            </div>
        </div>

        <!-- Slide 6: The cat is sad. -->
        <div class="slide">
            <div class="slide-emoji">🐱 😢</div>
            <div class="slide-text readable-text" onclick="speak(this.innerText)">
                <span class="syl-a">The</span> 
                <span class="syl-b">cat</span> 
                <span class="syl-a">is</span> 
                <span class="syl-b">sad.</span>
            </div>
        </div>

        <!-- Controls -->
        <div class="slide-controls">
            <button class="big-btn" onclick="changeSlide(-1)">⬅️ Back</button>
            <div class="dots" id="slideDots"></div>
            <button class="big-btn" onclick="changeSlide(1)">Next ➡️</button>
        </div>
    </div>

    <!-- TAB 2: FIND / SEARCH GAME -->
    <div id="searchTab" class="tab-content">
        <h2 class="readable-text" onclick="speak(this.innerText)" style="color: var(--quaternary); font-size: 2.6rem; margin-top: 0;">Find "is" 5 times!</h2>
        <div id="timer">Level <span id="levelNum">1</span> ⏱️ Time: <span id="timeText">60</span>s</div>
        <div class="word-grid" id="searchGrid"></div>
        <div id="searchFeedback" class="readable-text" onclick="speak(this.innerText)" style="font-size: 2.3rem; margin-top: 15px; font-weight: bold; min-height: 40px;"></div>
    </div>

    <!-- TAB 3: WRITE / TRAIN GAME -->
    <div id="writeTab" class="tab-content">
        <h2 class="readable-text" onclick="speak(this.innerText)" style="color: var(--quaternary); font-size: 2.6rem; margin-top: 0;">Catch the letters for "is"!</h2>
        <p style="font-size: 2rem; color: var(--primary); font-weight: bold; margin: 10px 0;">Round: <span id="writeRound">1</span> / 5</p>
        <div class="train-container">
            <div class="train" id="trainCars"></div>
        </div>
        <div class="answer-board" id="answerBoard"></div>
        <div id="writeFeedback" class="readable-text" onclick="speak(this.innerText)" style="font-size: 2.3rem; margin-top: 25px; font-weight: bold; min-height: 40px;"></div>
    </div>

    <!-- TAB 4: MATCH GAME -->
    <div id="matchTab" class="tab-content">
        <h2 class="readable-text" onclick="speak(this.innerText)" style="color: var(--quaternary); font-size: 2.6rem; margin-top: 0;">Match the sentence to the picture!</h2>
        <div class="match-container">
            <div class="match-column" id="sentencesCol"></div>
            <div class="match-column" id="emojisCol"></div>
        </div>
    </div>

    <!-- Confetti Overlay Container -->
    <div id="confetti"></div>

    <script>
        // --- GLOBAL SOUND & SPEECH SYNTHESIS ---
        let soundEnabled = true;
        let kidFriendlyVoice = null;

        function toggleSound() {
            soundEnabled = !soundEnabled;
            const btn = document.getElementById('soundToggleBtn');
            if (soundEnabled) {
                btn.innerHTML = "🔊 Sound: ON";
                btn.classList.remove('off');
                speak("Sound on");
            } else {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                }
                btn.innerHTML = "🔇 Sound: OFF";
                btn.classList.add('off');
            }
        }

        function loadVoices() {
            if (!('speechSynthesis' in window)) return;
            const voices = window.speechSynthesis.getVoices();
            // Prioritize warm, clear female / US English voices
            kidFriendlyVoice = voices.find(v => 
                v.name.includes('Google US English') ||
                v.name.includes('Samantha') ||
                v.name.includes('Zira') ||
                v.name.includes('Victoria') ||
                v.name.includes('Karen') ||
                (v.lang.startsWith('en') && v.name.toLowerCase().includes('female'))
            );

            if (!kidFriendlyVoice) {
                kidFriendlyVoice = voices.find(v => v.lang.startsWith('en'));
            }
        }

        if ('speechSynthesis' in window) {
            loadVoices();
            window.speechSynthesis.onvoiceschanged = loadVoices;
        }

        function speak(text) {
            if (!soundEnabled) return;
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const cleanText = text.replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g, "").trim();
                const msg = new SpeechSynthesisUtterance(cleanText || text);
                
                if (kidFriendlyVoice) {
                    msg.voice = kidFriendlyVoice;
                }
                msg.rate = 0.80;  // Kid-friendly slow rate
                msg.pitch = 1.15; // Cheerful higher pitch
                msg.volume = 1.0;
                window.speechSynthesis.speak(msg);
            }
        }

        // Shuffling helper
        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // Confetti burst
        function triggerConfetti() {
            const container = document.getElementById('confetti');
            const colors = ['#FF595E', '#FFCA3A', '#8AC926', '#1982C4', '#6A4C93'];
            for (let i = 0; i < 45; i++) {
                const piece = document.createElement('div');
                piece.className = 'confetti-piece';
                piece.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                piece.style.left = Math.random() * 100 + 'vw';
                piece.style.top = '-20px';
                piece.style.animationDuration = (Math.random() * 1.5 + 1.5) + 's';
                if (Math.random() > 0.5) {
                    piece.style.borderRadius = "50%";
                }
                container.appendChild(piece);
                setTimeout(() => piece.remove(), 3000);
            }
        }

        // Tab Navigation
        function openTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');

            if (tabId === 'learningTab') readCurrentSlide();
            if (tabId === 'searchTab') initSearchGame(1);
            if (tabId === 'writeTab') initWriteGame();
            if (tabId === 'matchTab') initMatchGame();
        }

        // --- TAB 1: READ (SLIDESHOW) ---
        let currentSlide = 0;
        const slides = document.querySelectorAll('.slide');
        const dotsContainer = document.getElementById('slideDots');

        slides.forEach((s, i) => {
            const dot = document.createElement('div');
            dot.className = i === 0 ? 'dot active' : 'dot';
            dotsContainer.appendChild(dot);
        });
        const dots = document.querySelectorAll('.dot');

        function changeSlide(dir) {
            slides[currentSlide].classList.remove('active');
            dots[currentSlide].classList.remove('active');

            currentSlide += dir;
            if (currentSlide < 0) currentSlide = slides.length - 1;
            if (currentSlide >= slides.length) currentSlide = 0;

            slides[currentSlide].classList.add('active');
            dots[currentSlide].classList.add('active');
            readCurrentSlide();
        }

        function readCurrentSlide() {
            if (currentSlide === 0) {
                speak("is");
            } else {
                const text = slides[currentSlide].querySelector('.slide-text').innerText;
                speak(text);
            }
        }

        window.onload = () => {
            setTimeout(() => {
                if (document.getElementById('learningTab').classList.contains('active')) {
                    readCurrentSlide();
                }
            }, 600);
        };

        // --- TAB 2: FIND (SEARCH GAME) ---
        let searchLevel = 1;
        let searchTimer = null;
        let timeLeft = 60;
        let foundCount = 0;
        // 10 random words from the 5 sentences
        const decoys = ["He", "tall", "She", "short", "It", "now", "happy", "The", "cat", "sad"];

        function initSearchGame(level) {
            clearInterval(searchTimer);
            searchLevel = level;
            timeLeft = 60;
            foundCount = 0;

            document.getElementById('levelNum').innerText = level;
            document.getElementById('timeText').innerText = timeLeft;
            const feedback = document.getElementById('searchFeedback');
            feedback.innerText = "";
            feedback.style.color = "var(--primary)";

            const grid = document.getElementById('searchGrid');
            grid.innerHTML = "";

            // Level 1: 3x3 = 9, Level 2: 4x4 = 16, Level 3: 5x5 = 25
            const totalWords = level === 1 ? 9 : (level === 2 ? 16 : 25);
            grid.style.gridTemplateColumns = `repeat(${Math.sqrt(totalWords)}, 1fr)`;

            // 5 instances of "is"
            let words = ["is", "is", "is", "is", "is"];
            while (words.length < totalWords) {
                words.push(decoys[Math.floor(Math.random() * decoys.length)]);
            }
            words = shuffleArray(words);

            words.forEach(word => {
                const btn = document.createElement('button');
                btn.className = 'search-word';
                btn.innerText = word;
                btn.onclick = () => handleSearchClick(btn, word);
                grid.appendChild(btn);
            });

            searchTimer = setInterval(() => {
                timeLeft--;
                document.getElementById('timeText').innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(searchTimer);
                    speak("Time is up! Let's try again.");
                    document.getElementById('searchFeedback').innerText = "Time's up! Let's try again! ⏳";
                    setTimeout(() => initSearchGame(searchLevel), 2500);
                }
            }, 1000);

            speak(`Level ${level}. Find the word 'is' five times!`);
        }

        function handleSearchClick(btn, word) {
            if (word === "is") {
                if (btn.classList.contains('found')) return;

                btn.classList.add('found');
                speak("is");
                foundCount++;
                triggerConfetti();

                if (foundCount === 5) {
                    clearInterval(searchTimer);
                    const feedback = document.getElementById('searchFeedback');
                    feedback.style.color = "var(--tertiary)";

                    if (searchLevel < 3) {
                        feedback.innerText = "Great Job! Next Level! 🎉";
                        speak("Great Job! Next Level!");
                        setTimeout(() => initSearchGame(searchLevel + 1), 2200);
                    } else {
                        feedback.innerText = "You beat all levels! You are a champion! 🏆";
                        speak("You beat all levels! You are a champion!");
                    }
                }
            } else {
                btn.classList.add('wrong');
                speak("Oops! Look for is.");
                const feedback = document.getElementById('searchFeedback');
                feedback.style.color = "var(--primary)";
                feedback.innerText = "Oops, look for 'is'!";

                setTimeout(() => {
                    btn.classList.remove('wrong');
                    if (feedback.innerText.includes("Oops")) feedback.innerText = "";
                }, 1300);

                // Pulse the correct target words as a hint
                document.querySelectorAll('.search-word').forEach(wBtn => {
                    if (wBtn.innerText === "is" && !wBtn.classList.contains('found')) {
                        wBtn.classList.add('hint');
                        setTimeout(() => wBtn.classList.remove('hint'), 1300);
                    }
                });
            }
        }

        // --- TAB 3: WRITE (TRAIN GAME) ---
        let currentWriteIndex = 0;
        let writeRounds = 1;
        const targetWord = ['i', 's']; // Exact dynamically handled word length

        function initWriteGame() {
            currentWriteIndex = 0;
            document.getElementById('writeRound').innerText = writeRounds;
            const feedback = document.getElementById('writeFeedback');
            feedback.innerText = "";
            feedback.style.color = "var(--quaternary)";

            // Answer slots matching exact word length
            const board = document.getElementById('answerBoard');
            board.innerHTML = "";
            for (let i = 0; i < targetWord.length; i++) {
                const slot = document.createElement('div');
                slot.className = 'answer-slot';
                slot.id = 'slot' + i;
                board.appendChild(slot);
            }

            // Train cars: correct letters + 5 random decoy letters
            const train = document.getElementById('trainCars');
            train.innerHTML = "";

            const alphabet = "abcdefghijklmnopqrstuvwxyz".split("");
            const decoyPool = alphabet.filter(l => !targetWord.includes(l));
            const shuffledPool = shuffleArray(decoyPool);

            let letters = [...targetWord];
            for (let i = 0; i < 5; i++) {
                letters.push(shuffledPool[i]);
            }
            letters = shuffleArray(letters);

            letters.forEach(letter => {
                const car = document.createElement('div');
                car.className = 'train-car';
                car.innerText = letter;
                car.onclick = () => handleTrainClick(letter, car);
                train.appendChild(car);
            });

            speak("Catch the letters to spell 'is'!");
        }

        function handleTrainClick(letter, carElement) {
            if (currentWriteIndex >= targetWord.length) return;

            if (letter === targetWord[currentWriteIndex]) {
                const slot = document.getElementById('slot' + currentWriteIndex);
                slot.innerText = letter;
                slot.style.backgroundColor = "#E8F4FA";
                slot.style.borderColor = "var(--tertiary)";
                speak(letter);
                currentWriteIndex++;

                if (currentWriteIndex === targetWord.length) {
                    speak("is! You did it!");
                    triggerConfetti();
                    const feedback = document.getElementById('writeFeedback');
                    feedback.style.color = "var(--tertiary)";
                    feedback.innerText = "Perfect! 🎉";
                    writeRounds++;

                    if (writeRounds <= 5) {
                        setTimeout(initWriteGame, 2200);
                    } else {
                        feedback.innerText = "You wrote it 5 times! You win! 🏆";
                        speak("You wrote it five times! You win!");
                        writeRounds = 1;
                    }
                }
            } else {
                const neededLetter = targetWord[currentWriteIndex];
                speak(`Try again! We need the letter ${neededLetter}`);
                const feedback = document.getElementById('writeFeedback');
                feedback.style.color = "var(--primary)";
                feedback.innerText = `Try again, we need the letter "${neededLetter}"!`;

                carElement.style.backgroundColor = "#555";

                // Pulse the correct car
                document.querySelectorAll('.train-car').forEach(c => {
                    if (c.innerText === neededLetter) {
                        c.classList.add('correct-hint');
                        setTimeout(() => c.classList.remove('correct-hint'), 1400);
                    }
                });

                setTimeout(() => {
                    carElement.style.backgroundColor = "var(--primary)";
                    if (feedback.innerText.includes("Try again")) feedback.innerText = "";
                }, 1400);
            }
        }

        // --- TAB 4: MATCH GAME ---
        const matchPairs = [
            {
                text: "He is tall.",
                html: '<span class="syl-a">He</span> <span class="syl-b">is</span> <span class="syl-a">tall.</span>',
                img: "👦 🦒"
            },
            {
                text: "She is short.",
                html: '<span class="syl-a">She</span> <span class="syl-b">is</span> <span class="syl-a">short.</span>',
                img: "👧 🧸"
            },
            {
                text: "It is happening now.",
                html: '<span class="syl-a">It</span> <span class="syl-b">is</span> <span class="syl-a">hap</span><span class="syl-b">pen</span><span class="syl-a">ing</span> <span class="syl-b">now.</span>',
                img: "⚡ ⏰"
            },
            {
                text: "He is happy.",
                html: '<span class="syl-a">He</span> <span class="syl-b">is</span> <span class="syl-a">hap</span><span class="syl-b">py.</span>',
                img: "👦 😄"
            },
            {
                text: "The cat is sad.",
                html: '<span class="syl-a">The</span> <span class="syl-b">cat</span> <span class="syl-a">is</span> <span class="syl-b">sad.</span>',
                img: "🐱 😢"
            }
        ];

        let selectedSentence = null;
        let selectedEmoji = null;
        let matchesFound = 0;

        function initMatchGame() {
            selectedSentence = null;
            selectedEmoji = null;
            matchesFound = 0;

            const sCol = document.getElementById('sentencesCol');
            const eCol = document.getElementById('emojisCol');
            sCol.innerHTML = "";
            eCol.innerHTML = "";

            // Independently shuffle both arrays
            const shuffledSentences = shuffleArray([...matchPairs]);
            const shuffledEmojis = shuffleArray([...matchPairs]);

            shuffledSentences.forEach(pair => {
                const div = document.createElement('div');
                div.className = 'match-item';
                div.innerHTML = pair.html;
                div.onclick = () => handleMatchClick('text', pair.text, div);
                sCol.appendChild(div);
            });

            shuffledEmojis.forEach(pair => {
                const div = document.createElement('div');
                div.className = 'match-item';
                div.style.fontSize = "3.8rem";
                div.innerText = pair.img;
                div.onclick = () => handleMatchClick('img', pair.img, div);
                eCol.appendChild(div);
            });

            speak("Match the sentence to the picture!");
        }

        function handleMatchClick(type, value, element) {
            if (element.classList.contains('matched')) return;

            if (type === 'text') {
                if (selectedSentence) selectedSentence.el.classList.remove('selected');
                selectedSentence = { val: value, el: element };
                element.classList.add('selected');
                speak(value);
            } else {
                if (selectedEmoji) selectedEmoji.el.classList.remove('selected');
                selectedEmoji = { val: value, el: element };
                element.classList.add('selected');
            }

            if (selectedSentence && selectedEmoji) {
                const isMatch = matchPairs.some(p => p.text === selectedSentence.val && p.img === selectedEmoji.val);

                if (isMatch) {
                    selectedSentence.el.classList.replace('selected', 'matched');
                    selectedEmoji.el.classList.replace('selected', 'matched');
                    triggerConfetti();
                    speak("Great match!");
                    matchesFound++;

                    if (matchesFound === matchPairs.length) {
                        setTimeout(() => {
                            speak("You matched all of them! You win!");
                            initMatchGame();
                        }, 2600);
                    }
                } else {
                    const sEl = selectedSentence.el;
                    const eEl = selectedEmoji.el;
                    sEl.style.borderColor = "var(--primary)";
                    sEl.style.backgroundColor = "#FFE8E8";
                    eEl.style.borderColor = "var(--primary)";
                    eEl.style.backgroundColor = "#FFE8E8";

                    speak("Try again!");

                    setTimeout(() => {
                        sEl.style.borderColor = "";
                        sEl.style.backgroundColor = "";
                        sEl.classList.remove('selected');
                        eEl.style.borderColor = "";
                        eEl.style.backgroundColor = "";
                        eEl.classList.remove('selected');
                    }, 1100);
                }

                selectedSentence = null;
                selectedEmoji = null;
            }
        }
    </script>
</body>
